spring.application.name=ebankChat
server.port=8085
spring.config.import=optional:file:.env[.properties],optional:file:ebankChat/.env[.properties]

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8083/mcp
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8084/mcp
discord.token=${DISCORD_TOKEN}

